<!doctype html>
<html lang="en" data-theme="graphite" data-accent="sage" data-single="false">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habits</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap"
    />
    <link rel="preload" href="/fonts/Monocraft.otf" as="font" type="font/otf" crossorigin />
    <script>
      // Apply the saved theme before React mounts so the page never flashes the default.
      (function () {
        var root = document.documentElement;
        try {
          var s = JSON.parse(localStorage.getItem('habitapp.settings') || '{}');
          var preset = s.preset || 'graphite';
          if (preset === 'system') {
            preset = window.matchMedia('(prefers-color-scheme: light)').matches ? 'paper' : 'graphite';
          }
          root.dataset.theme = preset;
          root.dataset.accent = s.accent || 'sage';
          root.dataset.single = s.singleColor ? 'true' : 'false';
        } catch (e) {
          root.dataset.theme = 'graphite';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
